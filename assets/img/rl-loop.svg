<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 450' width='900' height='450'><rect width='100%' height='100%' fill='white'/><defs><marker id='ar' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6 z' fill='#555'/></marker></defs><text x='20' y='28' font-size='14' font-weight='bold' fill='#222' font-family='Helvetica, Arial, sans-serif'>One reinforcement-learning step, and where the time goes</text><rect x='30' y='70' width='190' height='90' rx='6' fill='#fdf8d2' stroke='#777' stroke-width='1.2'/><text x='125.0' y='110.0' text-anchor='middle' font-size='13' font-weight='bold' fill='#222' font-family='Helvetica, Arial, sans-serif'>Generate</text><text x='125.0' y='127.0' text-anchor='middle' font-size='11' fill='#444' font-family='Helvetica, Arial, sans-serif'>G samples per prompt</text><text x='125.0' y='141.0' text-anchor='middle' font-size='11' fill='#444' font-family='Helvetica, Arial, sans-serif'>decode, 10k to 65k tokens each</text><text x='125.0' y='155.0' text-anchor='middle' font-size='11' fill='#444' font-family='Helvetica, Arial, sans-serif'>60 to 90% of wall clock</text><rect x='300' y='70' width='160' height='90' rx='6' fill='#f4f4f6' stroke='#777' stroke-width='1.2'/><text x='380.0' y='110.0' text-anchor='middle' font-size='13' font-weight='bold' fill='#222' font-family='Helvetica, Arial, sans-serif'>Score</text><text x='380.0' y='127.0' text-anchor='middle' font-size='11' fill='#444' font-family='Helvetica, Arial, sans-serif'>verifier / tests / judge</text><text x='380.0' y='141.0' text-anchor='middle' font-size='11' fill='#444' font-family='Helvetica, Arial, sans-serif'>group-normalized advantage</text><rect x='540' y='70' width='190' height='90' rx='6' fill='#d2e7fd' stroke='#777' stroke-width='1.2'/><text x='635.0' y='110.0' text-anchor='middle' font-size='13' font-weight='bold' fill='#222' font-family='Helvetica, Arial, sans-serif'>Train</text><text x='635.0' y='127.0' text-anchor='middle' font-size='11' fill='#444' font-family='Helvetica, Arial, sans-serif'>clipped policy gradient</text><text x='635.0' y='141.0' text-anchor='middle' font-size='11' fill='#444' font-family='Helvetica, Arial, sans-serif'>6 N_active FLOPs per token</text><text x='635.0' y='155.0' text-anchor='middle' font-size='11' fill='#444' font-family='Helvetica, Arial, sans-serif'>a few gradient steps</text><line x1='220' y1='115' x2='300' y2='115' stroke='#555' stroke-width='1.4' marker-end='url(#ar)'/><text x='260.0' y='107.0' text-anchor='middle' font-size='11' fill='#444' font-family='Helvetica, Arial, sans-serif'>responses + logprobs</text><line x1='460' y1='115' x2='540' y2='115' stroke='#555' stroke-width='1.4' marker-end='url(#ar)'/><text x='500.0' y='107.0' text-anchor='middle' font-size='11' fill='#444' font-family='Helvetica, Arial, sans-serif'>advantages</text><path d='M635,160 L635,192 L125,192 L125,160' fill='none' stroke='#b509ac' stroke-width='1.6' marker-end='url(#ar)'/><text x='380' y='212' text-anchor='middle' font-size='11.5' fill='#b509ac' font-family='Helvetica, Arial, sans-serif'>weight sync: 1 TB in 16 to 30 s (colocated broadcast) or every K steps over the network (disaggregated)</text><text x='30' y='258' font-size='13' font-weight='bold' fill='#222' font-family='Helvetica, Arial, sans-serif'>Colocated</text><text x='30' y='276' font-size='11.5' fill='#444' font-family='Helvetica, Arial, sans-serif'>same GPUs alternate; trainer state offloaded to DRAM/NVMe during generation</text><text x='30' y='292' font-size='11.5' fill='#444' font-family='Helvetica, Arial, sans-serif'>(Kimi K2/K3, DeepSeek-V4.1, slime for reasoning RL)</text><text x='470' y='258' font-size='13' font-weight='bold' fill='#222' font-family='Helvetica, Arial, sans-serif'>Disaggregated</text><text x='470' y='276' font-size='11.5' fill='#444' font-family='Helvetica, Arial, sans-serif'>separate pools, ~3:1 generation:training GPUs; async, a few steps of staleness</text><text x='470' y='292' font-size='11.5' fill='#444' font-family='Helvetica, Arial, sans-serif'>(AReaL, PipelineRL, Magistral, slime for agentic RL)</text><text x='30' y='330' font-size='12.5' font-weight='bold' fill='#222' font-family='Helvetica, Arial, sans-serif'>The long tail:</text><rect x='140' y='322' width='27' height='5' fill='#9ecae1'/><rect x='140' y='329' width='45' height='5' fill='#9ecae1'/><rect x='140' y='336' width='54' height='5' fill='#9ecae1'/><rect x='140' y='343' width='72' height='5' fill='#9ecae1'/><rect x='140' y='350' width='81' height='5' fill='#9ecae1'/><rect x='140' y='357' width='99' height='5' fill='#9ecae1'/><rect x='140' y='364' width='108' height='5' fill='#9ecae1'/><rect x='140' y='371' width='126' height='5' fill='#9ecae1'/><rect x='140' y='378' width='162' height='5' fill='#9ecae1'/><rect x='140' y='385' width='216' height='5' fill='#9ecae1'/><rect x='140' y='392' width='306' height='5' fill='#9ecae1'/><rect x='140' y='399' width='585' height='5' fill='#e6550d'/><text x='733' y='404' font-size='11' fill='#e6550d' font-family='Helvetica, Arial, sans-serif'>65k: 55 min at 20 tok/s</text><text x='140' y='422' font-size='11' fill='#444' font-family='Helvetica, Arial, sans-serif'>response lengths in one batch (std 4k to 4.5k tokens); a synchronous step waits for the longest one.</text><text x='140' y='437' font-size='11' fill='#444' font-family='Helvetica, Arial, sans-serif'>Fixes: partial rollouts (pause the tail, resume next step) and asynchronous training (do not wait).</text></svg>